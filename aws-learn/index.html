<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Learn — Interactive AWS Learning Platform</title>
  <meta name="description" content="Learn AWS services interactively — S3, Lambda, VPC, DynamoDB, SNS, IAM — with tutorials, CLI guides, and quizzes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar open" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-logo" id="home-link" style="background:none;border:none;cursor:pointer;text-align:left;padding:0;">
          <div class="sidebar-logo-icon">☁️</div>
          <div>
            <div class="sidebar-logo-text">AWS Learn</div>
            <div class="sidebar-logo-sub">7 modules · 1h 41min</div>
          </div>
        </button>
        <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">
          ✕
        </button>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-label">0/7 completed</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <nav class="module-nav" id="module-nav">
        <!-- Rendered by JS -->
      </nav>
    </aside>

    <!-- ── Main ───────────────────────────────────────────────────────── -->
    <div class="main" id="main">

      <!-- Topbar -->
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Toggle sidebar">
          ☰
        </button>
        <div class="breadcrumb">
          <span id="breadcrumb-home"
            style="cursor:pointer;color:var(--text-2)"
            onclick="showHome()"
            role="button"
            tabindex="0">AWS Learn</span>
          <span id="breadcrumb-sep" class="hidden">›</span>
          <strong id="breadcrumb-module"></strong>
        </div>
        <div class="topbar-actions">
          <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">☀️ Light</button>
          <a href="../index.html" class="back-btn" aria-label="Back to FocusFlow">← FocusFlow</a>
        </div>
      </header>

      <!-- Content -->
      <main class="content" role="main">

        <!-- Home view -->
        <div id="home-view">
          <div class="home-hero">
            <h1>Learn AWS, hands-on</h1>
            <p>Seven concise modules covering the AWS services used in FocusFlow and GradeSync — from object storage to serverless compute. Each module ends with a quiz to test your understanding.</p>
          </div>

          <div class="modules-grid" id="modules-grid">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Module view -->
        <div id="module-view" class="hidden">
          <!-- Rendered by JS when a module is opened -->
        </div>

      </main>
    </div><!-- /main -->

  </div><!-- /app -->

  <script src="js/app.js"></script>
</body>
</html>
